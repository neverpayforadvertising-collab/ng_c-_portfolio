<form
  [formGroup]="form"
  (ngSubmit)="submit()"
>

  <h2 mat-dialog-title>
    Add Expense
  </h2>

  <mat-dialog-content>

    <p>
      Record a business expense for
      financial reporting.
    </p>

    @if (errorMessage()) {
      <div
        class="form-error"
        role="alert"
      >
        {{ errorMessage() }}
      </div>
    }

    <div class="form-grid">

      <mat-form-field appearance="outline">
        <mat-label>Vendor</mat-label>

        <input
          matInput
          formControlName="vendor"
        />
      </mat-form-field>


      <mat-form-field appearance="outline">
        <mat-label>Category</mat-label>

        <mat-select
          formControlName="category"
        >
          @for (
            category of categories;
            track category
          ) {
            <mat-option
              [value]="category"
            >
              {{ category }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>


      <mat-form-field
        appearance="outline"
        class="full-width"
      >
        <mat-label>
          Description
        </mat-label>

        <input
          matInput
          formControlName="description"
        />
      </mat-form-field>


      <mat-form-field appearance="outline">
        <mat-label>
          Amount
        </mat-label>

        <input
          matInput
          type="number"
          step="0.01"
          min="0.01"
          formControlName="amount"
        />
      </mat-form-field>


      <mat-form-field appearance="outline">
        <mat-label>
          Expense date
        </mat-label>

        <input
          matInput
          type="date"
          formControlName="expenseDate"
        />
      </mat-form-field>


      <mat-form-field appearance="outline">
        <mat-label>
          Reference
        </mat-label>

        <input
          matInput
          formControlName="reference"
        />
      </mat-form-field>


      <mat-form-field
        appearance="outline"
        class="full-width"
      >
        <mat-label>
          Notes
        </mat-label>

        <textarea
          matInput
          rows="3"
          formControlName="notes"
        ></textarea>
      </mat-form-field>

    </div>

  </mat-dialog-content>


  <mat-dialog-actions align="end">

    <button
      mat-button
      type="button"
      (click)="cancel()"
      [disabled]="saving()"
    >
      Cancel
    </button>

    <button
      mat-flat-button
      type="submit"
      [disabled]="
        saving() ||
        form.invalid
      "
    >
      @if (saving()) {
        Saving...
      } @else {
        Add Expense
      }
    </button>

  </mat-dialog-actions>

</form>
